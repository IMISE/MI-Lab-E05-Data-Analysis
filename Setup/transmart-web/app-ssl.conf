server {
    listen 80;
    server_name CHANGE_ME;

    location / { return 301 https://$host$request_uri; }    
}
server {
    listen 443 ssl;
    server_name CHANGE_ME;
    
    rewrite /$ /transmart/;
    location /transmart {
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://tmapp:8080/transmart;
    }    

    ssl_certificate /etc/nginx/ssl/server.crt; # fügt Zertifikat hinzu
    ssl_certificate_key /etc/nginx/ssl/server.key; # fügt privaten Schlüssel hinzu
}
