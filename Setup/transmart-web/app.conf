server {
    listen 80;
    server_name CHANGE_ME;

    rewrite /$ /transmart/;
    location /transmart {
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://tmapp:8080/transmart;
    }    
}
